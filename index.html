<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCP Knowledge Graph(c) RMS</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14202e;--mute:#5b6b7e;--line:#c9d3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--card:#17212f;--ink:#e8eef6;--mute:#8fa1b6;--line:#2b3a4e}}
:root[data-theme="dark"]{--bg:#0e1622;--card:#17212f;--ink:#e8eef6;--mute:#8fa1b6;--line:#2b3a4e}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.2 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding:10px 16px 8px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px}
h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
header span{color:var(--mute);font-size:12px}
main{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:1fr 170px 1fr;gap:0 clamp(40px,7vw,110px)}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg path{fill:none;stroke-width:2;opacity:.55;transition:opacity .2s,stroke-width .2s}
svg path.on{opacity:1;stroke-width:3.5}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;position:relative;z-index:1}
.cl{background:var(--card);border-radius:12px;border-left:5px solid var(--c);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:0;transition:opacity .2s,transform .2s}
main.f .cl:not(.on){opacity:.35}
.cl h2{margin:0;font-size:13px;font-weight:800;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips a{color:var(--ink);text-decoration:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chips a::before{content:"";width:6px;height:6px;background:var(--c);border-radius:50%}
.tool .chips a::before{border-radius:1px;transform:rotate(45deg)}
.chips a:hover,.chips a:focus-visible{background:var(--c);border-color:var(--c);color:#fff;outline:none}
.hub{align-self:center;justify-self:center;width:170px;height:170px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-content:center;text-align:center;z-index:2;position:relative}
.hub b{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hub small{font-size:11px;padding:4px 14px 0;opacity:.8}
.side{position:absolute;top:calc(50% + 95px);font-size:12px;color:var(--mute);z-index:2}
@media (max-width:900px){body{height:auto}main{display:block}svg{display:none}.col{margin-bottom:8px}.hub{display:none}html,body{height:auto}}
</style>
</head>
<body>
<header><h1>FCP knowledge graph : Designed by Prof. Rahul M. Samant</h1><span id="n"></span></header>
<main id="m">
<svg id="s"></svg>
<div class="col" id="L"></div>
<div class="hub" id="h"><b>FCP</b><small>Fundamentals of Computer Programming</small></div>
<div class="col" id="R"></div>
</main>
<script>
const Y=id=>'https://youtu.be/'+id, G=u=>'https://rms-sof.github.io/'+u+'/', S=id=>'https://script.google.com/macros/s/'+id+'/exec';
const V=[
["Computer basics","#2563eb",[["0 Computer Programming","VeCdA5cO3Rw"],["0.1 Programming Process","SQoHr5DYUo4"],["1 Hardware & Software","6Q1Id-HrZkI"],["2 Internet & Cyber Security","HVWoo8sCMKI"]]],
["Starting with C","#0891b2",[["3.0 Intro to C","51kksOUUmlo"],["3.1 More Examples","jrzrPzyg4LI"],["3.2 C Introduction","mtg4xNfZsUc"],["3.3 Intro (part 4)","lD48EUaclkY"],["4 Practice Programs","uvgGJCIvlF8"],["4.1 Data Types & Science Apps","nicoBWmio2c"],["5.1 C as a Language","CM2lElJ8ZaA"]]],
["Flow & functions","#16a34a",[["6 Control Flow, Arrays, Functions","t872IwqYk4w"],["6.1 Recursion","xRvYGRDi4qs"],["9.3.1 Loops & 1-D Array","UEVa-PDFV8M"],["7.1 Strings","ivlKbkR5Yg8"]]],
["Memory & data","#d97706",[["7.2 Pointers & Dynamic Memory","VssWs7I2dXo"],["8 Structure, Union, Files","2QbYiLB0Y4I"],["8.1 Safe Programming & Debugging","2W-1T0ZZqcU"]]],
["Textbook chapters","#7c3aed",[["9.1 Ch 1 & 2","Hm4Q1k1FaWU"],["9.2 Ch 3 & 4","IDZJB2EttvE"],["9.3 Ch 8 & 13","WuM86AieAYw"],["9.∞ Cryptic C","cHRr4-HrlUs"]]],
["Skills & mindset","#db2777",[["10 Gamification of C","Oft0dSIZO0Y"],["12 Programming Skills","-8TTk8nSE74"],["13 Ganesha Wisdom","HiLVD-i8GWM"],["14 Challenges in Learning C","hP1gV1oD4J4"],["15 Exercise & Tests","2lFaajGl928"],["Lab Information","GhhRnwF_nsk"],["Calculator using Agents","o7-KpNEz2O0"]]]
].map(([t,c,l])=>[t,c,l.map(([a,id])=>[a,Y(id)]),'vid']);
const T=[
["Tests & quizzes","#e11d48",[["C Skill Test",G('C-Skill-Test')],["FCP Skill Test",G('FCP-skill-Test')],["Problem Solving Test",G('Problem-Solving-Skill-Test')],["Concept Quiz",S('AKfycbxxE6l5NKzpYEdBoAYfDpGnRuwVS7ymZpLm56zSuirFb2nR2BLMuXyhzAdtAcD8E6qh')],["Advanced Concept Quiz",S('AKfycbwzvDMPDHrCCA06mW_tRiIThMxIYpqzChLo--XOkFC_pvqJ2lwFStZyiYO5m90XIQ0B')],["Debug-Code Quiz",S('AKfycbwUrHEBN5cku4SGkaQGxFez9CycaFoWSf2_NICEic7WIZBG9xoUGzqA0l8LlSsm6U_v8g')],["Language Proficiency",G('Language-Profeciency-Tester')]]],
["Explore & visualise","#0d9488",[["C Overview",G('C-Programming')],["Mental Model Builder",G('C-Mental-Model')],["C Library Functions",G('C-Lib-Functions')],["Learn C by Games",G('C-By-Games')],["DNS & Firewall Animations",G('FCP2-animations')],["Agentic Calculator","https://agent3-kqzfcvap9pxxs7n4ftn8gg.streamlit.app/"]]],
["Classroom & hackathons","#ca8a04",[["Student Picker",G('Coronation')],["Hackathon 1 (simple)",S('AKfycbwpevnaXZrRKKug5ofeiSXGLVI0HBcgHyy9GlBchJGPWpfDiQD5SgaA_dHWWBwY_9-NAQ')],["Hackathon 2 (simple)",S('AKfycbxqspEv9V5aMJ6cb8XxQhKZuvxiA-S54E9aygyejPGGgAgU24AxVxM75hcbpcf6xhvP')],["Hackathon 3 (difficult)",S('AKfycbwWMk9pwHJZrAr555cZ0y0zwaNQPFI0llgq6cy8vkiJS27QgEAuxor6wiNIcQY0jUoarQ')],["Supporting Tool",S('AKfycbxrAgJ9I1CRH69UHyBPArDZIHF2pOoIPoGmP44lnFJFWIrpzD81DTYqjI8epcUJY6qK')]]]
].map(([t,c,l])=>[t,c,l,'tool']);
const m=document.getElementById('m'),svg=document.getElementById('s'),els=[];
function build(col,data){data.forEach(([t,c,l,k])=>{
 const d=document.createElement('section');d.className='cl '+k;d.style.setProperty('--c',c);d.style.flex=(1+l.length*.9)+' 1 0';
 d.innerHTML='<h2>'+t+'</h2><div class="chips">'+l.map(([a,u])=>'<a href="'+u+'" target="_blank" rel="noopener">'+a+'</a>').join('')+'</div>';
 col.appendChild(d);els.push({d,c,left:col.id==='L'});
 d.onmouseenter=()=>focus(d);d.onmouseleave=()=>focus(null);});}
build(document.getElementById('L'),V);build(document.getElementById('R'),T);
document.getElementById('n').textContent=V.reduce((a,x)=>a+x[2].length,0)+' videos and '+T.reduce((a,x)=>a+x[2].length,0)+' tools';
function draw(){
 svg.innerHTML='';const mb=m.getBoundingClientRect(),hb=document.getElementById('h').getBoundingClientRect();
 if(innerWidth<=900)return;
 els.forEach(e=>{const b=e.d.getBoundingClientRect(),y=b.top+b.height/2-mb.top,
  x1=e.left?b.right-mb.left:b.left-mb.left,x2=e.left?hb.left-mb.left+6:hb.right-mb.left-6,y2=hb.top+hb.height/2-mb.top,mx=(x1+x2)/2;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d','M'+x1+' '+y+' C'+mx+' '+y+' '+mx+' '+y2+' '+x2+' '+y2);p.setAttribute('stroke',e.c);svg.appendChild(p);e.p=p;});}
function focus(d){m.classList.toggle('f',!!d);els.forEach(e=>{const on=e.d===d;e.d.classList.toggle('on',on);e.p&&e.p.classList.toggle('on',on);});}
addEventListener('resize',draw);document.fonts&&document.fonts.ready.then(draw);draw();setTimeout(draw,300);
</script>
</body>
</html>
