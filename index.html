<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCP (c)RMS</title>
<style>
:root{--bg:#0f172a;--fg:#e2e8f0;--mut:#94a3b8;--card:#1e293b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]) {}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f8fafc;--fg:#0f172a;--mut:#475569;--card:#fff}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#e2e8f0;--mut:#94a3b8;--card:#1e293b}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
input{flex:1;min-width:160px;max-width:320px;padding:6px 10px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg);font-size:14px}
.hint{color:var(--mut);font-size:12px}
#wrap{position:relative;flex:1;display:flex;align-items:stretch;gap:48px;padding:6px 14px 4px;overflow:auto;min-height:0}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#root{align-self:center;z-index:1;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;padding:18px 14px;border-radius:50%;width:120px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;flex:none}
#root small{font-weight:400;font-size:11px}
#rows{flex:1;display:flex;flex-direction:column;gap:6px;z-index:1;min-width:720px}
.row{flex:1;display:flex;align-items:center;gap:12px;min-height:0}
.cl{flex:none;width:180px;padding:6px 10px;border-radius:10px;border-left:6px solid var(--c);background:var(--card);font-weight:600;font-size:13px}
.cl span{display:block;font-weight:400;color:var(--mut);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
a.ch{padding:3px 8px;border-radius:999px;border:1px solid var(--c);color:var(--fg);text-decoration:none;font-size:12px;background:var(--card);white-space:nowrap}
a.ch:hover{background:var(--c);color:#fff}
.dim{opacity:.15}
footer{padding:3px 14px 6px;color:var(--mut);font-size:11px}
</style></head><body>
<header><h1>FCP By Rahul Samant</h1><input id="q" placeholder="Search topics, tools, quizzes…"><span class="hint">Click any node to open · Hover a topic to trace its path</span></header>
<div id="wrap"><svg id="sv"></svg>
<div id="root">FCP<small>Fundamentals of Computer Programming</small></div>
<div id="rows"></div></div>
<footer>Designed by Prof. Rahul M. Samant </footer>
<script>
const Y="https://youtu.be/",G="https://rms-sof.github.io/",S="https://script.google.com/macros/s/";
const D=[
["1 · Foundations","Lectures",'#6366f1',[["FCP 0 Computer Programming",Y+"VeCdA5cO3Rw"],["0.1 Programming Process",Y+"SQoHr5DYUo4"],["1 Hardware & Software",Y+"6Q1Id-HrZkI"],["2 Internet & Cyber Security",Y+"HVWoo8sCMKI"],["Lab Information",Y+"GhhRnwF_nsk"]]],
["2 · C Basics","Lectures",'#0ea5e9',[["3.0 Intro to C",Y+"51kksOUUmlo"],["3.1 More Examples",Y+"jrzrPzyg4LI"],["3.2 C Introduction",Y+"mtg4xNfZsUc"],["3.3 Intro (part 4)",Y+"lD48EUaclkY"],["4 Programs for Practice",Y+"uvgGJCIvlF8"],["4.1 Data Types",Y+"nicoBWmio2c"],["5.1 Linguistic View",Y+"CM2lElJ8ZaA"]]],
["3 · Control & Functions","Lectures",'#10b981',[["6 Control Flow, Arrays, Functions",Y+"t872IwqYk4w"],["6.1 Recursion",Y+"xRvYGRDi4qs"],["Extra 9.3.1 Loops & 1-D Array",Y+"UEVa-PDFV8M"]]],
["4 · Memory, Structs, Files","Lectures",'#f59e0b',[["7.1 Strings",Y+"ivlKbkR5Yg8"],["7.2 Pointers & Dynamic Memory",Y+"VssWs7I2dXo"],["7.2 Pointers by Programming",Y+"VBZnOh2rSxs"],["8 Structure, Union, Files",Y+"2QbYiLB0Y4I"],["8.1 Structures by Programming",Y+"mdcTgBRHJ4U"],["9.4 Files by Programming",Y+"yt2mHqJ7b3I"]]],
["5 · Revision & Practice","Lectures",'#ef4444',[["9.1 Ch 1 & 2",Y+"Hm4Q1k1FaWU"],["9.2 Ch 3 & 4",Y+"IDZJB2EttvE"],["9.3 Ch 8 & 13",Y+"WuM86AieAYw"],["9.∞ Cryptic C",Y+"cHRr4-HrlUs"],["8.1 Safe Programming & Debugging",Y+"2W-1T0ZZqcU"],["15 Exercise & Tests",Y+"2lFaajGl928"]]],
["6 · Mindset & Skills","Lectures",'#a855f7',[["10 Gamification of C",Y+"Oft0dSIZO0Y"],["12 Programming Skills",Y+"-8TTk8nSE74"],["13.1 Lessons from Bappa",Y+"HiLVD-i8GWM"],["13.2 Gandhian Philosophy",Y+"t-Darzx_ZD4"],["14 Challenges in Learning C",Y+"hP1gV1oD4J4"],["Calculator using Agents",Y+"o7-KpNEz2O0"]]],
["Tests & Quizzes","Tools",'#14b8a6',[["C Skill Test",G+"C-Skill-Test/"],["FCP Skill Test",G+"FCP-skill-Test/"],["Problem Solving Test",G+"Problem-Solving-Skill-Test/"],["Language Proficiency",G+"Language-Profeciency-Tester/"],["Quiz 1 (simple)",S+"AKfycbwpevnaXZrRKKug5ofeiSXGLVI0HBcgHyy9GlBchJGPWpfDiQD5SgaA_dHWWBwY_9-NAQ/exec"],["Quiz 2 (simple)",S+"AKfycbxqspEv9V5aMJ6cb8XxQhKZuvxiA-S54E9aygyejPGGgAgU24AxVxM75hcbpcf6xhvP/exec"],["Quiz 3 (difficult)",S+"AKfycbwWMk9pwHJZrAr555cZ0y0zwaNQPFI0llgq6cy8vkiJS27QgEAuxor6wiNIcQY0jUoarQ/exec"],["Concept Quiz",S+"AKfycbxxE6l5NKzpYEdBoAYfDpGnRuwVS7ymZpLm56zSuirFb2nR2BLMuXyhzAdtAcD8E6qh/exec"],["Advanced Concept Quiz",S+"AKfycbwzvDMPDHrCCA06mW_tRiIThMxIYpqzChLo--XOkFC_pvqJ2lwFStZyiYO5m90XIQ0B/exec"],["Debug-Code Quiz",S+"AKfycbwUrHEBN5cku4SGkaQGxFez9CycaFoWSf2_NICEic7WIZBG9xoUGzqA0l8LlSsm6U_v8g/exec"]]],
["Learn & Visualize","Tools",'#f97316',[["C Programming Overview",G+"C-Programming/"],["Learn C by Games",G+"C-By-Games/"],["C By Programs",G+"C-By-Programs/"],["C Library Functions",G+"C-Lib-Functions/"],["Mental Model of C",G+"C-Mental-Model/"],["C Visualized 1",G+"C-Visualized/"],["C Visualized 2",G+"C-Visualized-Part2/"],["DNS/Firewall Animations",G+"FCP2-animations/"],["Entire Contents",G+"FCP-Knowledge-Graph/"]]],
["Classroom Utilities","Tools",'#64748b',[["Student Picker",G+"Coronation/"],["Supporting Tool",S+"AKfycbxrAgJ9I1CRH69UHyBPArDZIHF2pOoIPoGmP44lnFJFWIrpzD81DTYqjI8epcUJY6qK/exec"],["Agentic Calculator App","https://agent3-kqzfcvap9pxxs7n4ftn8gg.streamlit.app/"]]]
];
const rows=document.getElementById('rows'),sv=document.getElementById('sv'),wrap=document.getElementById('wrap'),root=document.getElementById('root');
D.forEach(([n,k,c,items],i)=>{
 const r=document.createElement('div');r.className='row';r.style.setProperty('--c',c);
 r.innerHTML=`<div class="cl">${n}<span>${k} · ${items.length}</span></div><div class="chips">${items.map(([t,u])=>`<a class="ch" target="_blank" rel="noopener" href="${u}">${t}</a>`).join('')}</div>`;
 r.onmouseenter=()=>hl(i);r.onmouseleave=()=>hl(-1);rows.appendChild(r);
});
function draw(){
 const w=wrap.getBoundingClientRect(),a=root.getBoundingClientRect();
 sv.setAttribute('viewBox',`0 0 ${wrap.scrollWidth} ${wrap.scrollHeight}`);sv.style.width=wrap.scrollWidth+'px';sv.style.height=wrap.scrollHeight+'px';
 const x1=a.right-w.left+wrap.scrollLeft,y1=a.top+a.height/2-w.top+wrap.scrollTop;
 sv.innerHTML=[...rows.children].map((r,i)=>{
  const b=r.querySelector('.cl').getBoundingClientRect(),x2=b.left-w.left+wrap.scrollLeft,y2=b.top+b.height/2-w.top+wrap.scrollTop,m=(x1+x2)/2;
  return `<path id="p${i}" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" fill="none" stroke="${D[i][2]}" stroke-width="2.5" opacity=".7"/>`}).join('');
}
function hl(i){[...rows.children].forEach((r,j)=>r.classList.toggle('dim',i>=0&&i!==j));D.forEach((_,j)=>{const p=document.getElementById('p'+j);if(p)p.style.opacity=i<0?.7:(i===j?1:.08)})}
document.getElementById('q').oninput=e=>{const s=e.target.value.toLowerCase();
 [...rows.children].forEach(r=>{let hit=false;r.querySelectorAll('.ch').forEach(c=>{const m=!s||c.textContent.toLowerCase().includes(s);c.classList.toggle('dim',!m);hit=hit||m});r.classList.toggle('dim',!!s&&!hit&&!r.querySelector('.cl').textContent.toLowerCase().includes(s))})};
addEventListener('resize',draw);draw();setTimeout(draw,300);
</script></body></html>
