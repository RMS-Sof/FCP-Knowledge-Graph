<style>
:root{--bg:#f5f7fc;--bg2:#ffffff;--fg:#141a33;--mut:#5d6788;--line:#d5dbf0;--acc:#0a7d68;--edge:#7a86ad;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1f;--bg2:#131a33;--fg:#e8ecf8;--mut:#95a0c4;--line:#2a3563;--acc:#7cf0d0;--edge:#8896c8}}
:root[data-theme="dark"]{--bg:#0a0f1f;--bg2:#131a33;--fg:#e8ecf8;--mut:#95a0c4;--line:#2a3563;--acc:#7cf0d0;--edge:#8896c8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px 6px}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--acc)}
.sub{font-size:12px;color:var(--mut)}
.sp{flex:1}
input[type=search]{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;width:230px;max-width:100%}
button{font:inherit;cursor:pointer}
.btn{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
.btn:hover{border-color:var(--acc)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:12px}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.off{opacity:.4}
.chip b{color:var(--mut);font-weight:400}
main{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#tip{position:absolute;pointer-events:none;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:none;max-width:260px;box-shadow:0 4px 18px #0004}
#tip small{color:var(--mut);display:block}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px}
.key{position:absolute;left:60px;bottom:16px;font-size:11px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;pointer-events:none}
#panel{position:absolute;right:12px;top:8px;width:320px;max-height:calc(100% - 20px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;display:none;box-shadow:0 10px 40px #0005}
#panel h2{font-size:18px;margin:6px 0 4px;line-height:1.25}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.tag i{width:9px;height:9px;border-radius:50%}
.open{display:block;text-align:center;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:700;border-radius:10px;padding:10px;margin:12px 0}
.url{font-size:11px;color:var(--mut);word-break:break-all;margin-bottom:6px}
.note{font-size:12px;color:var(--mut);background:var(--bg);border-radius:8px;padding:7px 9px;margin:8px 0}
.x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mut);font-size:22px}
.nb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.nb button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.nb button:hover{border-color:var(--acc)}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:14px 0 0}
dialog{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:16px;max-width:560px;width:calc(100% - 24px);padding:20px}
dialog::backdrop{background:#0008}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:400;font-size:11px;text-transform:uppercase}
@media(max-width:700px){#panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:48%}.zoom{bottom:auto;top:8px}.key{display:none}input[type=search]{width:100%}}
</style>
</head>

const key={};N.forEach((n,i)=>{n.id=i;key[n.s]=i});
const hub=g=>1+g;
const E=[];const ed=(a,b,t)=>E.push({a,b,t});
groups.forEach((_,g)=>ed(0,hub(g),'h'));
N.forEach(n=>{if(n.k=='v'||n.k=='t')ed(hub(n.g),n.id,'m')});
for(let g=0;g<6;g++){const m=N.filter(n=>n.k=='v'&&n.g==g);for(let i=1;i<m.length;i++)ed(m[i-1].id,m[i].id,'s')}
[['Agents','Agent'],['8.1','Debug Q'],['2','Animate'],['3.0','Overview'],['7.1','C Lib'],['10','C Games'],['15','C Skill'],['15','FCP Skill'],['12','Problems'],['5.1','Language'],['9.1','Concept Q'],['9.∞','Adv Q'],['Lab','Hack 1'],['4','Hack 1'],['Hack 1','Hack 2'],['Hack 2','Hack 3'],['Concept Q','Adv Q'],['Overview','C Lib'],['Overview','All']].forEach(p=>ed(key[p[0]],key[p[1]],'x'));
const adj=N.map(()=>new Set());E.forEach(e=>{adj[e.a].add(e.b);adj[e.b].add(e.a)});
N.forEach(n=>{n.r=n.k=='r'?26:n.k=='h'?16:n.k=='t'?9:7.5;n.col=n.k=='r'?'#7cf0d0':groups[n.g][1]});

// Deterministic, collision-free layout: each cluster is a "flower" (hub + members on a ring); clusters sit on an ellipse and are then relaxed apart.
function layout(){
 const S=86,cl=groups.map((_,g)=>{const m=N.filter(n=>n.g==g&&n.k!='h'),n=m.length,arc=Math.min(5.3,(n-1)*1.05),r=Math.max(112,S*(n-1)/arc);return{g,m,r,arc,e:r+50,x:0,y:0}});
 const pad=40,R=cl.reduce((a,c)=>a+2*c.e+pad,0)/(2*Math.PI)*1.05;let a=-Math.PI/2;
 cl.forEach(c=>{const w=(2*c.e+pad)/(R*2*Math.PI)*2*Math.PI;c.x=Math.cos(a+w/2)*R*1.35;c.y=Math.sin(a+w/2)*R;a+=w});
 for(let it=0;it<600;it++){cl.forEach((c,i)=>{cl.forEach((d,j)=>{if(j<=i)return;let dx=d.x-c.x,dy=d.y-c.y,l=Math.hypot(dx,dy)||1,m=c.e+d.e+14;if(l<m){const f=(m-l)/2/l;c.x-=dx*f;c.y-=dy*f;d.x+=dx*f;d.y+=dy*f}});
  const l=Math.hypot(c.x,c.y),m=c.e+110;if(l<m){c.x*=m/l;c.y*=m/l}})}
 cl.forEach(c=>{const h=N[hub(c.g)];h.tx=c.x;h.ty=c.y;h.lu=[0,1];const ph=Math.atan2(c.y,c.x),n=c.m.length;
  c.m.forEach((m,i)=>{const th=n>1?ph-c.arc/2+i*c.arc/(n-1):ph;m.tx=c.x+Math.cos(th)*c.r;m.ty=c.y+Math.sin(th)*c.r;m.lu=[Math.cos(th),Math.sin(th)]})});
 N[0].tx=N[0].ty=0;N.forEach(n=>{n.x=0;n.y=0})}
layout();

const cv=document.getElementById('cv'),cx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,dpr=1,cam={x:0,y:0,k:1},dirty=1,sel=null,hov=null,qs='',off=new Set(),anim=1;
function resize(){const r=cv.getBoundingClientRect();dpr=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;dirty=1}
function fit(){const vis=N.filter(n=>!off.has(n.g)||n.k=='r');let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;vis.forEach(n=>{x0=Math.min(x0,n.tx-40);x1=Math.max(x1,n.tx+40);y0=Math.min(y0,n.ty-30);y1=Math.max(y1,n.ty+30)});
 const k=Math.min(W/(x1-x0+60),H/(y1-y0+60),1.8);cam.k=k;cam.x=W/2-(x0+x1)/2*k;cam.y=H/2-(y0+y1)/2*k;dirty=1}
function step(){anim=0;N.forEach(n=>{const dx=n.tx-n.x,dy=n.ty-n.y;if(Math.abs(dx)+Math.abs(dy)>.3){n.x+=dx*.11;n.y+=dy*.11;anim=1}else{n.x=n.tx;n.y=n.ty}})}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function alive(n){return n.k=='r'||!off.has(n.g)}
function lit(n){if(!alive(n))return 0;let ok=1;if(sel!=null)ok=n.id==sel||adj[sel].has(n.id);if(ok&&qs)ok=match(n);return ok}
function match(n){return (n.s+' '+n.t).toLowerCase().includes(qs)}
function draw(){cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 const fg=css('--fg'),ed_=css('--edge'),bg=css('--bg');cx.setTransform(dpr*cam.k,0,0,dpr*cam.k,dpr*cam.x,dpr*cam.y);const k=cam.k;
 E.forEach(e=>{const a=N[e.a],b=N[e.b];if(!alive(a)||!alive(b))return;const on=sel!=null&&(e.a==sel||e.b==sel);let al=sel!=null?(on?1:.06):(qs?(lit(a)&&lit(b)?.7:.05):1);
  cx.globalAlpha=al*(e.t=='h'?.55:e.t=='m'?.3:e.t=='s'?.65:.6);cx.lineWidth=(on?2.4:e.t=='x'?1.6:1.1)/k;cx.strokeStyle=e.t=='x'?css('--acc'):(e.t=='h'?ed_:groups[(a.g!=null?a.g:b.g)][1]);
  cx.setLineDash(e.t=='x'?[5/k,4/k]:[]);cx.beginPath();cx.moveTo(a.x,a.y);if(e.t=='x'){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,h=N[hub(a.g)],same=a.g==b.g,px=same?h.x:0,py=same?h.y:0,f=same?.4:.5;cx.quadraticCurveTo(mx+(px-mx)*f,my+(py-my)*f,b.x,b.y)}else cx.lineTo(b.x,b.y);cx.stroke()});
 cx.setLineDash([]);
 N.forEach(n=>{if(!alive(n))return;const l=lit(n),isH=hov==n.id||sel==n.id;cx.globalAlpha=l?1:.13;const r=n.r*(isH?1.3:1);
  cx.fillStyle=n.col;cx.shadowColor=n.col;cx.shadowBlur=(isH?26:n.k=='v'?7:12)*(l?1:0);
  cx.beginPath();if(n.k=='t'){cx.moveTo(n.x,n.y-r*1.2);cx.lineTo(n.x+r*1.2,n.y);cx.lineTo(n.x,n.y+r*1.2);cx.lineTo(n.x-r*1.2,n.y);cx.closePath()}else cx.arc(n.x,n.y,r,0,7);cx.fill();cx.shadowBlur=0;
  if(sel==n.id||(qs&&match(n)&&n.k!='h')){cx.strokeStyle=fg;cx.lineWidth=2/k;cx.stroke()}
  const fs=(n.k=='r'?15:n.k=='h'?12.5:10.5)/k;cx.font=(n.k=='v'?'600 ':'700 ')+fs+'px "Space Grotesk",system-ui,sans-serif';cx.textAlign='center';
  if(n.k=='r'){cx.fillStyle='#08101e';cx.textBaseline='middle';cx.fillText('FCP',n.x,n.y+.5)}
  else{cx.fillStyle=fg;const u=n.lu,o=n.r*1.25+4/k;
   if(n.k=='h'){cx.textBaseline='top';hl(n.s).forEach((t,i)=>cx.fillText(t,n.x,n.y+n.r+4/k+i*fs*1.15))}
   else{cx.textAlign=u[0]>.4?'left':u[0]<-.4?'right':'center';cx.textBaseline=Math.abs(u[0])>.4?'middle':(u[1]>0?'top':'bottom');cx.fillText(n.s,n.x+u[0]*o,n.y+u[1]*o)}}});
 cx.globalAlpha=1}
function hl(t){if(t.length<=11)return[t];const m=t.length/2;let b=0,d=1e9;[...t].forEach((c,i)=>{if(c==' '&&Math.abs(i-m)<d){d=Math.abs(i-m);b=i}});return[t.slice(0,b),t.slice(b+1)]}
function loop(){if(anim){step();dirty=1}if(dirty){draw();dirty=0}requestAnimationFrame(loop)}
// interaction
const P=new Map();let dragN=null,pan=null,mv=0,pd=0;
const wp=(x,y)=>{const r=cv.getBoundingClientRect();return[(x-r.left-cam.x)/cam.k,(y-r.top-cam.y)/cam.k]};
function hit(e){const[x,y]=wp(e.clientX,e.clientY);let b=null,bd=1e9;N.forEach(n=>{if(!alive(n)||!lit(n)&&sel==null&&0)return;const d=Math.hypot(n.x-x,n.y-y);if(d<n.r*1.6+4/cam.k&&d<bd){bd=d;b=n}});return b}
function zoomAt(f,sx,sy){const k=Math.min(4,Math.max(.25,cam.k*f)),r=k/cam.k;cam.x=sx-(sx-cam.x)*r;cam.y=sy-(sy-cam.y)*r;cam.k=k;dirty=1}
const pdist=()=>{const a=[...P.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);mv=0;
 if(P.size==2){pd=pdist();dragN=null;pan=null;return}
 const n=hit(e);if(n&&n.k!='r'){dragN=n}else pan=[e.clientX,e.clientY,cam.x,cam.y];cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
 if(!P.has(e.pointerId)){const n=hit(e);if(n?n.id!=hov:hov!=null){hov=n?n.id:null;dirty=1;cv.style.cursor=n?'pointer':'grab'}tip(n,e);return}
 const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size==2){const d=pdist(),r=cv.getBoundingClientRect(),a=[...P.values()];zoomAt(d/pd,(a[0][0]+a[1][0])/2-r.left,(a[0][1]+a[1][1])/2-r.top);pd=d;mv=9;return}
 mv+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);
 if(dragN&&mv>4){const[x,y]=wp(e.clientX,e.clientY);dragN.x=dragN.tx=x;dragN.y=dragN.ty=y;dirty=1}
 else if(pan){cam.x=pan[2]+e.clientX-pan[0];cam.y=pan[3]+e.clientY-pan[1];dirty=1}});
const up=e=>{P.delete(e.pointerId);cv.style.cursor='grab';if(mv<=4&&P.size==0){if(dragN)pick(dragN.id);else if(pan)pick(null)}
 dragN=null;pan=null;if(P.size==1)pd=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{tip(null)});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
function tip(n,e){const t=$('tip');if(!n||n.k=='r'){t.style.display='none';return}const r=cv.getBoundingClientRect();
 t.innerHTML=esc(n.t)+'<small>'+(n.k=='v'?'▶ Lecture video':n.k=='t'?'◆ Tool / app':'Category · '+members(n.g)+' items')+'</small>';t.style.display='block';
 t.style.left=Math.min(e.clientX-r.left+14,r.width-270)+'px';t.style.top=(e.clientY-r.top+14)+'px'}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const members=g=>N.filter(n=>n.g==g&&(n.k=='v'||n.k=='t')).length;
// panel
function pick(id){sel=id;const p=$('panel');dirty=1;if(id==null){p.style.display='none';return}
 const n=N[id],gc=n.col;let h='<button class="x" aria-label="Close" onclick="pick(null)">×</button>';
 h+='<div class="tag"><i style="background:'+gc+'"></i>'+(n.k=='r'?'Course':n.k=='v'?'Lecture video · '+groups[n.g][0]:n.k=='t'?'Tool · '+groups[n.g][0]:'Category')+'</div><h2>'+esc(n.t)+'</h2>';
 if(n.u){h+='<a class="open" href="'+n.u+'" target="_blank" rel="noopener noreferrer">'+(n.k=='v'?'▶ Watch on YouTube':'Open tool ↗')+'</a><div class="url">'+esc(n.u)+'</div>'}
 if(n.n)h+='<div class="note">🔗 '+n.n+' duplicate listings merged into this one node'+(n.al&&n.al.length?' — listed as: '+n.al.map(esc).join(', '):'')+'.</div>';
 if(n.k=='h')h+='<div class="note">'+members(n.g)+' resources in this cluster. Click one below to explore.</div>';
 const nb=[...adj[id]].map(i=>N[i]).filter(m=>m.k!='r');
 if(nb.length){h+='<h3>Connected ('+nb.length+')</h3><div class="nb">'+nb.map(m=>'<button onclick="pick('+m.id+')" style="border-left:3px solid '+m.col+'">'+(m.k=='v'?'▶ ':m.k=='t'?'◆ ':'')+esc(m.s)+'</button>').join('')+'</div>'}
 p.innerHTML=h;p.style.display='block';p.scrollTop=0}
// chips, search, dialog
const nv=N.filter(n=>n.k=='v').length,nt=N.filter(n=>n.k=='t').length,dups=N.reduce((a,n)=>a+(n.n?n.n-1:0),0);
$('dupBtn').textContent='✓ '+dups+' duplicates merged';
$('chips').innerHTML='<div class="chip" style="cursor:default">'+nv+' videos · '+nt+' tools · '+(nv+nt)+' unique links</div>'+groups.map((g,i)=>'<button class="chip" data-g="'+i+'"><i style="background:'+g[1]+'"></i>'+g[0]+' <b>'+members(i)+'</b></button>').join('');
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=+b.dataset.g;off.has(g)?off.delete(g):off.add(g);b.classList.toggle('off');if(sel!=null&&!alive(N[sel]))pick(null);dirty=1});
$('q').addEventListener('input',e=>{qs=e.target.value.trim().toLowerCase();dirty=1});
$('q').addEventListener('keydown',e=>{if(e.key=='Enter'&&qs){const m=N.find(n=>n.k!='r'&&n.k!='h'&&alive(n)&&match(n));if(m)pick(m.id)}});
addEventListener('keydown',e=>{if(e.key=='/'&&document.activeElement!=$('q')){e.preventDefault();$('q').focus()}if(e.key=='Escape'){pick(null);$('q').value='';qs='';$('q').blur()}});
$('zi').onclick=()=>zoomAt(1.3,W/2,H/2);$('zo').onclick=()=>zoomAt(1/1.3,W/2,H/2);$('zf').onclick=fit;
$('dupBtn').onclick=()=>{const d=$('dlg'),ms=N.filter(n=>n.n);
 d.innerHTML='<h2 style="margin:0 0 4px">Duplicates resolved</h2><div class="sub">The file held '+(nv+nt+dups)+' links; '+dups+' repeats were merged, leaving '+(nv+nt)+' unique nodes. Every original link is still in the graph.</div><table><tr><th>Node</th><th>Listings</th><th>Appeared as</th></tr>'+ms.map(n=>'<tr><td><a href="#" style="color:var(--acc)" onclick="$(\'dlg\').close();pick('+n.id+');return false">'+esc(n.t)+'</a></td><td>'+n.n+'×</td><td>'+(n.al&&n.al.length?n.al.map(esc).join('; '):'Same title')+'</td></tr>').join('')+'</table><button class="btn" onclick="$(\'dlg\').close()">Close</button>';d.showModal()};
addEventListener('resize',()=>{resize();fit()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>dirty=1);
resize();fit();loop();
</script>
</body>
</html>
