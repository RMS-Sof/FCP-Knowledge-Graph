html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0;font:700 17px Georgia,serif;flex:1;min-width:220px}
h1 small{display:block;font:400 12px "Segoe UI",sans-serif;color:var(--mut)}
input{padding:7px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);min-width:200px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);padding:8px 16px}
.map{display:flex;align-items:center;padding:8px 16px 24px;max-width:1500px;margin:auto}

.root small{font:400 11px "Segoe UI",sans-serif;opacity:.8}
.brs{flex:1;margin-left:28px;border-left:2px solid var(--ln);min-width:0}
.br{position:relative;display:flex;gap:14px;padding:10px 0 10px 30px}
.br::before{content:"";position:absolute;left:0;top:28px;width:30px;border-top:2px solid var(--ln)}
.un{flex:none;width:170px;align-self:flex-start;padding:8px 10px;border-radius:10px;background:var(--card);border:2px solid var(--c);font-weight:700;font-size:13.5px;position:relative}
.un::after{content:"";position:absolute;right:-14px;top:50%;width:14px;border-top:2px solid var(--ln)}
.un span{display:block;font-weight:400;font-size:11.5px;color:var(--mut)}
.it{flex:1;min-width:0;border-left:2px solid var(--ln);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row i{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);width:62px;flex:none}
a.n{display:inline-block;padding:4px 10px;border-radius:999px;text-decoration:none;font-size:12.5px;border:1px solid transparent;transition:.12s}
a.v{background:var(--vbg);color:var(--vid)}a.t{background:var(--tbg);color:var(--tl)}
a.n:hover{transform:translateY(-1px);border-color:currentColor;box-shadow:0 2px 6px rgba(0,0,0,.15)}
a.n:visited{opacity:.65}
.dim{opacity:.18;pointer-events:none}
@media(max-width:900px){.map{flex-direction:column;align-items:stretch}.root{align-self:center;width:110px;margin-bottom:12px}.brs{margin-left:0;border-left:0}.br{flex-direction:column;padding-left:0}.br::before,.un::after{display:none}.un{width:100%}.it{border-left:0;padding-left:0}.row i{width:100%}}
